<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Dubai</title>
    <link rel="stylesheet" href="../common.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
.container {
    max-width: 900px;
    margin: 0 auto;
    padding: 60px 40px;
}

.back-button {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: rgba(255, 255, 255, 0.8);
    text-decoration: none;
    border-radius: 10px;
    font-weight: 500;
    font-size: 14px;
    transition: all 0.3s ease;
    margin-bottom: 40px;
}

.back-button:hover {
    background: rgba(255, 255, 255, 0.08);
    color: white;
    transform: translateX(-3px);
}

.form-container {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px;
    padding: 60px;
}

.form-badge {
    display: inline-block;
    padding: 8px 20px;
    background: rgba(120, 119, 198, 0.1);
    border: 1px solid rgba(120, 119, 198, 0.2);
    border-radius: 50px;
    color: #7877c6;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 20px;
    letter-spacing: 1.5px;
}

h1 {
    font-size: 48px;
    font-weight: 800;
    color: white;
    margin-bottom: 20px;
    letter-spacing: -1px;
}

.subtitle {
    font-size: 18px;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 50px;
    line-height: 1.7;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.form-group {
    margin-bottom: 25px;
}

label {
    display: block;
    color: rgba(255, 255, 255, 0.8);
    font-weight: 600;
    margin-bottom: 12px;
    font-size: 14px;
    letter-spacing: 0.5px;
}

input, textarea, select {
    width: 100%;
    padding: 16px 20px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    color: white;
    font-size: 16px;
    font-family: 'Inter', sans-serif;
    transition: all 0.3s ease;
}

input::placeholder, textarea::placeholder {
    color: rgba(255, 255, 255, 0.3);
}

input:focus, textarea:focus, select:focus {
    outline: none;
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(120, 119, 198, 0.5);
}

select {
    cursor: pointer;
}

.submit-button {
    width: 100%;
    padding: 20px;
    background: linear-gradient(135deg, #7877c6 0%, #4a3aff 100%);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
}

.submit-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 40px rgba(120, 119, 198, 0.4);
}

.success-message {
    margin-top: 30px;
    padding: 20px;
    background: rgba(45, 212, 191, 0.1);
    border: 1px solid rgba(45, 212, 191, 0.3);
    border-radius: 12px;
    color: #2dd4bf;
    text-align: center;
    font-size: 16px;
    font-weight: 600;
}

@media (max-width: 768px) {
    .form-container {
        padding: 40px 30px;
    }
    h1 {
        font-size: 32px;
    }
    .form-row {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-button">← Back to Home</a>
        <div class="form-container">
            <div class="form-badge">GET IN TOUCH</div>
            <h1>Let's Find Your Dream Property</h1>
            <p class="subtitle">Our expert team is ready to guide you through every step of your Dubai real estate journey</p>
            <form id="inquiryForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" name="name" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" required placeholder="john@example.com">
                    </div>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" name="phone" required placeholder="+971 50 123 4567">
                </div>
                <div class="form-group">
                    <label>Property Interest</label>
                    <select name="interest">
                        <option>Apartment</option>
                        <option>Villa</option>
                        <option>Townhouse</option>
                        <option>Penthouse</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Your Message</label>
                    <textarea name="message" rows="5" required placeholder="Tell us about your property requirements..."></textarea>
                </div>
                <button type="submit" class="submit-button">Send Message →</button>
            </form>
            <div id="successMessage" class="success-message" style="display: none;">
                ✅ Thank you! We'll contact you within 24 hours.
            </div>
        </div>
    </div>
    <script>
document.getElementById('inquiryForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const data = Object.fromEntries(formData);

    const submissions = JSON.parse(localStorage.getItem('inquiries') || '[]');
    submissions.push({
        ...data,
        timestamp: new Date().toISOString()
    });
    localStorage.setItem('inquiries', JSON.stringify(submissions));

    document.getElementById('successMessage').style.display = 'block';
    this.reset();

    setTimeout(() => {
        document.getElementById('successMessage').style.display = 'none';
    }, 5000);
});
</script>
</body>
</html>
