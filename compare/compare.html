<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Properties - Dubai Real Estate</title>
    <link rel="stylesheet" href="../common.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
.container {
    max-width: 1600px;
    margin: 0 auto;
    padding: 60px 40px;
}

.back-button {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: rgba(255, 255, 255, 0.8);
    text-decoration: none;
    border-radius: 10px;
    font-weight: 500;
    font-size: 14px;
    transition: all 0.3s ease;
    margin-bottom: 40px;
}

.back-button:hover {
    background: rgba(255, 255, 255, 0.08);
    color: white;
    transform: translateX(-3px);
}

.comparison-header {
    text-align: center;
    margin-bottom: 60px;
}

.comparison-badge {
    display: inline-block;
    padding: 8px 20px;
    background: rgba(120, 119, 198, 0.1);
    border: 1px solid rgba(120, 119, 198, 0.2);
    border-radius: 50px;
    color: #7877c6;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 20px;
    letter-spacing: 1.5px;
}

h1 {
    font-size: 56px;
    font-weight: 800;
    color: white;
    margin-bottom: 20px;
    letter-spacing: -1px;
}

.subtitle {
    font-size: 20px;
    color: rgba(255, 255, 255, 0.6);
}

.comparison-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 30px;
}

.property-compare-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    overflow: hidden;
    transition: all 0.3s ease;
}

.property-compare-card:hover {
    transform: translateY(-5px);
    border-color: rgba(120, 119, 198, 0.3);
}

.property-image-compare {
    width: 100%;
    height: 250px;
    object-fit: cover;
    background: linear-gradient(135deg, rgba(120, 119, 198, 0.2), rgba(74, 58, 255, 0.2));
}

.property-compare-details {
    padding: 30px;
}

.property-compare-price {
    font-size: 36px;
    font-weight: 800;
    background: linear-gradient(135deg, #7877c6 0%, #4a3aff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
}

.property-compare-address {
    font-size: 18px;
    color: white;
    margin-bottom: 10px;
    font-weight: 600;
}

.property-compare-location {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 20px;
}

.compare-row {
    display: flex;
    justify-content: space-between;
    padding: 15px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.compare-label {
    color: rgba(255, 255, 255, 0.6);
    font-size: 14px;
    font-weight: 500;
}

.compare-value {
    color: white;
    font-size: 16px;
    font-weight: 700;
}

.best-value {
    background: rgba(45, 212, 191, 0.1);
    border: 1px solid rgba(45, 212, 191, 0.3);
    padding: 10px 20px;
    border-radius: 8px;
    color: #2dd4bf;
    font-size: 13px;
    font-weight: 700;
    margin-top: 20px;
    text-align: center;
}

.view-property-btn {
    display: block;
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #7877c6 0%, #4a3aff 100%);
    color: white;
    text-align: center;
    text-decoration: none;
    border-radius: 12px;
    font-weight: 600;
    font-size: 15px;
    transition: all 0.3s ease;
    margin-top: 20px;
}

.view-property-btn:hover {
    transform: scale(1.02);
    box-shadow: 0 10px 30px rgba(120, 119, 198, 0.4);
}

@media (max-width: 768px) {
    h1 {
        font-size: 36px;
    }
    .comparison-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>
    <div class="container">
        <a href="../listings/listings.html" class="back-button">← Back to Listings</a>
        <div class="comparison-header">
            <div class="comparison-badge">SIDE-BY-SIDE ANALYSIS</div>
            <h1>Property Comparison</h1>
            <p class="subtitle">Compare key features and find the best value for your investment</p>
        </div>
        <div class="comparison-grid" id="comparisonGrid"></div>
    </div>
    <script>
const properties = [{"price": 1250000, "address": "Marina Promenade - Marina Diamond Tower 2", "location": "Dubai Marina", "beds": 2, "baths": 2, "sqft": 1100, "description": "Stunning 2BR apartment with full marina views and premium finishes. Spacious layout with modern kitchen and floor-to-ceiling windows.", "type": "Apartment", "image": "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=1200"}, {"price": 2850000, "address": "Burj Khalifa District - The Address Downtown", "location": "Downtown Dubai", "beds": 3, "baths": 3, "sqft": 2400, "description": "Luxury 3BR apartment with iconic Burj Khalifa views. Premium finishes throughout with marble flooring and smart home features.", "type": "Apartment", "image": "https://images.unsplash.com/photo-1613490493576-7fde63acd811?w=1200"}, {"price": 980000, "address": "Jumeirah Village Circle - District 13", "location": "Jumeirah Village Circle", "beds": 2, "baths": 2, "sqft": 1300, "description": "Modern 2BR townhouse in gated community with landscaped gardens. Perfect for families seeking quiet living with city access.", "type": "Townhouse", "image": "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1200"}, {"price": 3650000, "address": "Palm Jumeirah - Garden Homes Frond M", "location": "Palm Jumeirah", "beds": 4, "baths": 5, "sqft": 3800, "description": "Exclusive 4BR beachfront villa on the Palm with private pool. Direct beach access and stunning Arabian Gulf views.", "type": "Villa", "image": "https://images.unsplash.com/photo-1613977257363-707ba9348227?w=1200"}, {"price": 1920000, "address": "Business Bay - Executive Towers Boulevard", "location": "Business Bay", "beds": 2, "baths": 3, "sqft": 1650, "description": "Premium 2BR apartment in Business Bay with Burj Khalifa and Dubai Canal views. Prime location near Dubai Mall.", "type": "Apartment", "image": "https://images.unsplash.com/photo-1567496898669-ee935f5f647a?w=1200"}, {"price": 4350000, "address": "Emirates Hills - Sector E Villa District", "location": "Emirates Hills", "beds": 5, "baths": 6, "sqft": 6500, "description": "Palatial 5BR villa in Dubai&#x27;s most exclusive community. Mediterranean architecture with private pool and landscaped garden.", "type": "Villa", "image": "https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=1200"}];

function formatPrice(price) {
    return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        minimumFractionDigits: 0
    }).format(price);
}

function formatPricePerSqft(price, sqft) {
    return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        minimumFractionDigits: 0
    }).format(price / sqft);
}

function findBestValue() {
    let minPricePerSqft = Infinity;
    let bestIndex = -1;

    properties.forEach((prop, index) => {
        const pricePerSqft = prop.price / prop.sqft;
        if (pricePerSqft < minPricePerSqft) {
            minPricePerSqft = pricePerSqft;
            bestIndex = index;
        }
    });

    return bestIndex;
}

function renderComparison() {
    const grid = document.getElementById('comparisonGrid');
    const bestValueIndex = findBestValue();

    // Show first 3 properties for comparison
    const compareCount = Math.min(3, properties.length);

    for (let index = 0; index < compareCount; index++) {
        const property = properties[index];
        const pricePerSqft = property.price / property.sqft;
        const isBestValue = index === bestValueIndex;

        const imageHtml = property.image 
            ? `<img src="${property.image}" alt="${property.address}" class="property-image-compare">`
            : `<div class="property-image-compare" style="display: flex; align-items: center; justify-content: center; font-size: 60px;">🏠</div>`;

        const card = document.createElement('div');
        card.className = 'property-compare-card';
        card.innerHTML = `
            ${imageHtml}
            <div class="property-compare-details">
                <div class="property-compare-price">${formatPrice(property.price)}</div>
                <div class="property-compare-address">${property.address}</div>
                <div class="property-compare-location">📍 ${property.location || 'Dubai'}</div>

                <div class="compare-row">
                    <span class="compare-label">Property Type</span>
                    <span class="compare-value">${property.type || 'Residential'}</span>
                </div>
                <div class="compare-row">
                    <span class="compare-label">Bedrooms</span>
                    <span class="compare-value">${property.beds}</span>
                </div>
                <div class="compare-row">
                    <span class="compare-label">Bathrooms</span>
                    <span class="compare-value">${property.baths}</span>
                </div>
                <div class="compare-row">
                    <span class="compare-label">Square Feet</span>
                    <span class="compare-value">${property.sqft.toLocaleString()} sqft</span>
                </div>
                <div class="compare-row">
                    <span class="compare-label">Price per sqft</span>
                    <span class="compare-value">${formatPricePerSqft(property.price, property.sqft)}</span>
                </div>

                ${isBestValue ? '<div class="best-value">🏆 BEST VALUE FOR MONEY</div>' : ''}

                <a href="../property_detail/property_${index + 1}.html" class="view-property-btn">
                    View Full Details →
                </a>
            </div>
        `;
        grid.appendChild(card);
    }
}

renderComparison();
</script>
</body>
</html>
